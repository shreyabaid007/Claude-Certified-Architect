name: Missing or thin topic
description: A topic has no note, or the note that exists is too shallow to revise from.
title: "[Topic]: "
labels:
  - topic-gap
body:
  - type: markdown
    attributes:
      value: |
        Use this when something you needed was not here, or was here but too thin to be useful.

        **Before you file:** do not include exam questions or anything recalled from an exam you sat. Describing a *concept* you found under-covered is fine. Describing *an item you were asked* is not. See [CONTRIBUTING.md](../blob/main/CONTRIBUTING.md).

  - type: dropdown
    id: level
    attributes:
      label: Level
      options:
        - Foundations (CCAR-F)
        - Professional (CCAR-P)
        - Both
        - Not sure
    validations:
      required: true

  - type: dropdown
    id: module
    attributes:
      label: Module
      options:
        - "Foundations 01 - AI Fluency: Framework & Foundations"
        - Foundations 02 - Building with the Claude API
        - Foundations 03 - Claude on Google Cloud
        - Foundations 04 - Claude Code in Action
        - Professional 01 - Claude Platform & Solution Design
        - Professional 02 - Enterprise Integration & Production
        - Professional 03 - Responsible AI, Safety & Risk
        - Professional 04 - Stakeholder Engagement, Lifecycle & GTM
        - Professional 05 - Team Enablement & Operational Productivity
        - Does not fit an existing module
        - Not sure
    validations:
      required: true

  - type: dropdown
    id: gap
    attributes:
      label: What kind of gap
      options:
        - No note exists for this topic
        - A note exists but the topic is only mentioned in passing
        - The concept is explained but there is no diagram or comparison table
        - The Exam Traps table does not cover this distinction
        - The note covers the what but not the why or the tradeoff
    validations:
      required: true

  - type: textarea
    id: topic
    attributes:
      label: The topic
      description: Name the concept and describe what a reader should be able to do after reading it.
      placeholder: |
        Prompt caching: what gets cached, cache lifetime, how the cache breakpoint interacts
        with a system prompt, and when caching stops paying for itself.
    validations:
      required: true

  - type: textarea
    id: source
    attributes:
      label: Where it is documented
      description: Link the public documentation covering this, if you know of it. Helps whoever writes the note.
    validations:
      required: false

  - type: checkboxes
    id: offer
    attributes:
      label: Would you like to write it?
      options:
        - label: I am happy to open a pull request for this myself.
          required: false

  - type: checkboxes
    id: rules
    attributes:
      label: Confirmation
      options:
        - label: This report contains no exam questions and no verbatim course material.
          required: true
