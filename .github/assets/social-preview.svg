<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640" font-family="DejaVu Sans, Helvetica, Arial, sans-serif">

  <!-- Background -->
  <rect width="1280" height="640" fill="#14181c"/>

  <!-- Soft palette wash, echoing the notes' diagram colours -->
  <defs>
    <linearGradient id="wash" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffc107" stop-opacity="0.10"/>
      <stop offset="55%" stop-color="#5c6bc0" stop-opacity="0.07"/>
      <stop offset="100%" stop-color="#28a745" stop-opacity="0.09"/>
    </linearGradient>
  </defs>
  <rect width="1280" height="640" fill="url(#wash)"/>

  <!-- Accent rule, left -->
  <rect x="96" y="150" width="6" height="200" rx="3" fill="#ffc107"/>

  <!-- Title -->
  <text x="140" y="205" font-size="66" font-weight="bold" fill="#f2f4f6">Claude Certified</text>
  <text x="140" y="278" font-size="66" font-weight="bold" fill="#f2f4f6">Architect</text>

  <!-- Subtitle -->
  <text x="140" y="336" font-size="27" fill="#9fb0bd">Community study notes for the certification exams</text>

  <!-- Level chips -->
  <g>
    <rect x="140" y="372" width="248" height="46" rx="23" fill="#ffc107" fill-opacity="0.14" stroke="#ffc107" stroke-opacity="0.55"/>
    <text x="264" y="402" font-size="22" font-weight="bold" fill="#ffd75e" text-anchor="middle">Foundations · CCAR-F</text>

    <rect x="406" y="372" width="256" height="46" rx="23" fill="#28a745" fill-opacity="0.14" stroke="#28a745" stroke-opacity="0.55"/>
    <text x="534" y="402" font-size="22" font-weight="bold" fill="#5cd67f" text-anchor="middle">Professional · CCAR-P</text>
  </g>

  <!-- Stats row -->
  <g font-size="24" fill="#c4d0d9">
    <text x="140" y="480">9 modules</text>
    <text x="290" y="480" fill="#5c6bc0">•</text>
    <text x="318" y="480">40 notes</text>
    <text x="446" y="480" fill="#5c6bc0">•</text>
    <text x="474" y="480">151-term glossary</text>
    <text x="712" y="480" fill="#5c6bc0">•</text>
    <text x="740" y="480">exam traps</text>
  </g>

  <!-- Divider -->
  <rect x="140" y="522" width="600" height="1" fill="#2c343b"/>

  <!-- Footer line -->
  <text x="140" y="562" font-size="20" fill="#7c8b98">Unofficial · Not affiliated with Anthropic or Pearson · CC BY-SA 4.0</text>

  <!-- Decorative diagram motif, right side: mirrors the notes' flowchart palette -->
  <g opacity="0.92">
    <!-- node 1 -->
    <rect x="878" y="172" width="150" height="66" rx="10" fill="#fff3cd" stroke="#ffc107" stroke-width="2"/>
    <text x="953" y="212" font-size="21" font-weight="bold" fill="#000" text-anchor="middle">Concept</text>
    <!-- arrow -->
    <path d="M953 238 L953 276" stroke="#5c6bc0" stroke-width="3"/>
    <path d="M953 284 l-7 -12 h14 z" fill="#5c6bc0"/>
    <!-- node 2 -->
    <rect x="878" y="288" width="150" height="66" rx="10" fill="#e8eaf6" stroke="#5c6bc0" stroke-width="2"/>
    <text x="953" y="320" font-size="17" font-weight="bold" fill="#000" text-anchor="middle">Cost · Risk</text>
    <text x="953" y="342" font-size="17" font-weight="bold" fill="#000" text-anchor="middle">Complexity</text>
    <!-- arrow -->
    <path d="M953 354 L953 392" stroke="#28a745" stroke-width="3"/>
    <path d="M953 400 l-7 -12 h14 z" fill="#28a745"/>
    <!-- node 3 -->
    <rect x="878" y="404" width="150" height="66" rx="10" fill="#d4edda" stroke="#28a745" stroke-width="2"/>
    <text x="953" y="444" font-size="21" font-weight="bold" fill="#000" text-anchor="middle">Decision</text>
  </g>

  <!-- Faint bracket framing the motif -->
  <path d="M1086 160 h34 v320 h-34" fill="none" stroke="#2c343b" stroke-width="2"/>
</svg>
